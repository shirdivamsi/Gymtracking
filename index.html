<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strength Log</title>
<meta name="description" content="A personal strength-training log: what you lifted, when, and when to add weight.">
<meta name="theme-color" content="#141719">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strength Log">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body {
    margin:0;
    padding:0;
    background:#141719;
    /* keep content clear of notches and the home bar */
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  body { -webkit-text-size-adjust:100%; }
</style>
</head>
<body>
<style>
  :root{
    --iron:#141719;
    --plate:#1D2226;
    --plate-2:#252B30;
    --knurl:#333B41;
    --chalk:#EDEFEC;
    --steel:#8B959C;
    --steel-dim:#5E686F;
    --amber:#F0B429;
    --amber-dim:#6B5216;
    --rust:#B4442E;
    --display:"Barlow Condensed","Oswald","Arial Narrow",sans-serif;
    --body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono","SF Mono",Menlo,monospace;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  #sl-app{
    font-family:var(--body);
    background:var(--iron);
    color:var(--chalk);
    min-height:100vh;
    max-width:560px;
    margin:0 auto;
    position:relative;
    overflow-x:hidden;
  }
  #sl-app button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  #sl-app input, #sl-app select{font-family:inherit;}
  #sl-app :focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  /* ---------- header ---------- */
  .sl-top{
    padding:20px 18px 0;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  .sl-wordmark{
    font-family:var(--display);
    font-weight:700;
    font-size:26px;
    letter-spacing:.10em;
    text-transform:uppercase;
    line-height:1;
    margin:0;
  }
  .sl-wordmark em{font-style:normal;color:var(--amber);}
  .sl-today-date{
    font-family:var(--mono);
    font-size:11px;
    color:var(--steel-dim);
    letter-spacing:.06em;
    text-transform:uppercase;
    white-space:nowrap;
  }

  /* ---------- tabs ---------- */
  .sl-tabs{
    display:flex;
    gap:0;
    margin:16px 18px 0;
    border-bottom:1px solid var(--knurl);
  }
  .sl-tab{
    font-family:var(--display);
    font-size:16px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--steel-dim);
    padding:8px 0 10px;
    margin-right:26px;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    transition:color .15s ease;
  }
  .sl-tab[data-on="1"]{color:var(--chalk);border-bottom-color:var(--amber);}

  .sl-page{padding:0 18px 96px;}
  .sl-hide{display:none !important;}

  /* ---------- shared bits ---------- */
  .sl-eyebrow{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--steel-dim);
    margin:26px 0 10px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .sl-eyebrow::after{content:"";flex:1;height:1px;background:var(--knurl);}

  .sl-card{
    background:var(--plate);
    border:1px solid var(--knurl);
    border-radius:3px;
    padding:14px 15px;
    margin-bottom:10px;
  }

  .sl-btn{
    display:block;
    width:100%;
    background:var(--amber);
    color:#171310;
    font-family:var(--display);
    font-size:19px;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    padding:15px;
    border-radius:3px;
  }
  .sl-btn:disabled{background:var(--plate-2);color:var(--steel-dim);cursor:not-allowed;}
  .sl-btn-ghost{
    display:block;
    width:100%;
    border:1px dashed var(--knurl);
    color:var(--steel);
    font-family:var(--display);
    font-size:17px;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
    padding:14px;
    border-radius:3px;
    background:transparent;
  }
  .sl-btn-ghost:hover{color:var(--chalk);border-color:var(--steel-dim);}
  .sl-btn-quiet{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--steel-dim);
    padding:8px 10px;
    border:1px solid var(--knurl);
    border-radius:3px;
  }
  .sl-btn-quiet:hover{color:var(--chalk);}

  .sl-empty{
    text-align:center;
    padding:34px 14px;
    color:var(--steel-dim);
    font-size:14px;
    line-height:1.6;
  }
  .sl-empty strong{
    display:block;
    font-family:var(--display);
    font-size:22px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--steel);
    margin-bottom:6px;
  }

  /* ---------- date strip ---------- */
  .sl-datestrip{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:18px;
    border:1px solid var(--knurl);
    border-radius:3px;
    background:var(--plate);
  }
  .sl-datestrip button{
    padding:12px 16px;
    color:var(--steel);
    font-size:16px;
    line-height:1;
  }
  .sl-datestrip button:hover:not(:disabled){color:var(--amber);}
  .sl-datestrip button:disabled{color:#2C3237;cursor:not-allowed;}
  .sl-datestrip-mid{text-align:center;padding:9px 4px;flex:1;background:none;border:none;color:inherit;}
  .sl-datestrip-mid:hover .sl-datestrip-sub{color:var(--amber);}
  .sl-datestrip-day{
    font-family:var(--display);
    font-size:19px;
    font-weight:600;
    letter-spacing:.10em;
    text-transform:uppercase;
    line-height:1.15;
  }
  .sl-datestrip-sub{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.10em;
    color:var(--steel-dim);
    text-transform:uppercase;
  }

  .sl-daystat{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.08em;
    color:var(--steel-dim);
    text-transform:uppercase;
    margin:12px 0 4px;
  }
  .sl-daystat b{color:var(--chalk);font-weight:500;}

  /* ---------- logged entry ---------- */
  .sl-entry{
    background:var(--plate);
    border:1px solid var(--knurl);
    border-left:2px solid var(--knurl);
    border-radius:3px;
    padding:13px 14px;
    margin-bottom:9px;
  }
  .sl-entry[data-pr="1"]{border-left-color:var(--amber);}
  .sl-entry-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .sl-entry-name{
    font-family:var(--display);
    font-size:20px;
    font-weight:600;
    letter-spacing:.05em;
    text-transform:uppercase;
    line-height:1.1;
  }
  .sl-entry-gear{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.08em;
    color:var(--steel-dim);
    text-transform:uppercase;
    margin-top:4px;
  }
  .sl-sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;}
  .sl-set-chip{
    font-family:var(--mono);
    font-size:12px;
    background:var(--plate-2);
    border:1px solid var(--knurl);
    border-radius:2px;
    padding:5px 8px;
    color:var(--chalk);
    letter-spacing:.02em;
  }
  .sl-set-chip span{color:var(--steel-dim);}
  .sl-pr-flag{
    display:inline-block;
    font-family:var(--mono);
    font-size:9px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--amber);
    border:1px solid var(--amber-dim);
    border-radius:2px;
    padding:3px 6px;
    margin-top:10px;
  }
  .sl-icon-btn{
    color:var(--steel-dim);
    font-family:var(--mono);
    font-size:11px;
    padding:4px 6px;
    letter-spacing:.06em;
    flex-shrink:0;
  }
  .sl-icon-btn:hover{color:var(--rust);}

  /* ---------- sheet ---------- */
  .sl-sheet{
    position:fixed;
    inset:0;
    background:var(--iron);
    z-index:50;
    overflow-y:auto;
    max-width:560px;
    margin:0 auto;
    animation:sl-rise .2s ease-out;
  }
  @keyframes sl-rise{from{transform:translateY(14px);opacity:0;}to{transform:none;opacity:1;}}
  @media (prefers-reduced-motion:reduce){
    .sl-sheet{animation:none;}
    #sl-app *{transition:none !important;}
  }
  .sl-sheet-bar{
    position:sticky;
    top:0;
    background:var(--iron);
    border-bottom:1px solid var(--knurl);
    /* clear the status bar and Dynamic Island — the sheet is fixed to the
       viewport, so it does not inherit the body's safe-area padding */
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px 8px;
    display:flex;
    align-items:center;
    gap:6px;
    z-index:2;
  }
  .sl-back{
    flex-shrink:0;
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    color:var(--chalk);
    border-radius:3px;
    line-height:1;
  }
  .sl-back:hover{background:var(--plate-2);color:var(--amber);}
  .sl-sheet-cancel{
    display:block;
    width:100%;
    margin-top:26px;
    padding:15px;
    border:1px solid var(--knurl);
    border-radius:3px;
    color:var(--steel);
    font-family:var(--display);
    font-size:17px;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
  }
  .sl-sheet-cancel:hover{color:var(--chalk);border-color:var(--steel-dim);}
  .sl-sheet-title{
    font-family:var(--display);
    font-size:19px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    line-height:1.15;
    flex:1;
    min-width:0;
  }
  .sl-sheet-body{padding:0 16px calc(40px + env(safe-area-inset-bottom));}
  .sl-sheet[data-anim="0"]{animation:none;}

  /* ---------- search + picker ---------- */
  .sl-search{
    width:100%;
    background:var(--plate);
    border:1px solid var(--knurl);
    border-radius:3px;
    color:var(--chalk);
    padding:13px 14px;
    font-size:15px;
    margin-top:16px;
  }
  .sl-search::placeholder{color:var(--steel-dim);}

  .sl-pick{
    width:100%;
    text-align:left;
    padding:13px 2px;
    border-bottom:1px solid var(--knurl);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }
  .sl-pick:hover .sl-pick-name{color:var(--amber);}
  .sl-pick-name{
    font-family:var(--display);
    font-size:19px;
    font-weight:500;
    letter-spacing:.05em;
    text-transform:uppercase;
    line-height:1.15;
    transition:color .12s ease;
  }
  .sl-pick-gear{
    font-family:var(--mono);
    font-size:10px;
    color:var(--steel-dim);
    letter-spacing:.06em;
    text-transform:uppercase;
    margin-top:3px;
  }
  .sl-pick-last{
    font-family:var(--mono);
    font-size:12px;
    color:var(--steel);
    text-align:right;
    white-space:nowrap;
    flex-shrink:0;
  }
  .sl-pick-last small{display:block;font-size:9px;color:var(--steel-dim);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;}

  /* ---------- last time panel ---------- */
  .sl-lasttime{
    border:1px solid var(--knurl);
    border-radius:3px;
    background:var(--plate);
    padding:15px;
    margin-top:16px;
  }
  .sl-lasttime-label{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--steel-dim);
    display:flex;
    justify-content:space-between;
    margin-bottom:9px;
  }
  .sl-lasttime-load{
    font-family:var(--display);
    font-size:44px;
    font-weight:700;
    line-height:.9;
    letter-spacing:.01em;
  }
  .sl-lasttime-load small{
    font-family:var(--mono);
    font-size:13px;
    font-weight:400;
    letter-spacing:.08em;
    color:var(--steel);
    margin-left:6px;
    text-transform:uppercase;
  }

  /* ---------- THE STACK (signature) ---------- */
  .sl-stack{margin-top:14px;}
  .sl-stack-rail{
    display:flex;
    flex-direction:column-reverse;
    gap:3px;
    padding:10px 0 12px;
    position:relative;
  }
  .sl-plate-row{display:flex;align-items:center;gap:10px;}
  .sl-plate{
    height:20px;
    border-radius:2px;
    background:linear-gradient(180deg,var(--plate-2),#1A1F23);
    border:1px solid var(--knurl);
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding-right:8px;
    font-family:var(--mono);
    font-size:11px;
    color:var(--steel);
    min-width:56px;
    flex-shrink:0;
    transition:all .2s ease;
  }
  .sl-plate[data-cur="1"]{
    background:linear-gradient(180deg,#3A3126,#241D14);
    border-color:var(--amber-dim);
    color:var(--chalk);
    height:26px;
    font-size:13px;
  }
  .sl-plate[data-next="1"]{
    background:transparent;
    border:1px dashed var(--amber);
    color:var(--amber);
    height:26px;
    font-size:13px;
  }
  .sl-plate-tag{
    font-family:var(--mono);
    font-size:9px;
    letter-spacing:.10em;
    text-transform:uppercase;
    color:var(--steel-dim);
    white-space:nowrap;
  }
  .sl-plate-tag[data-hot="1"]{color:var(--amber);}

  .sl-cue{
    border:1px solid var(--amber-dim);
    background:rgba(240,180,41,.06);
    border-radius:3px;
    padding:12px 14px;
    margin-top:12px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .sl-cue-mark{
    font-family:var(--display);
    font-size:26px;
    font-weight:700;
    color:var(--amber);
    line-height:1;
  }
  .sl-cue-text{font-size:13px;line-height:1.45;color:var(--chalk);}
  .sl-cue-text b{color:var(--amber);font-weight:600;}
  .sl-cue[data-tone="hold"]{border-color:var(--knurl);background:transparent;}
  .sl-cue[data-tone="hold"] .sl-cue-mark{color:var(--steel-dim);}
  .sl-cue[data-tone="hold"] .sl-cue-text{color:var(--steel);}
  .sl-cue[data-tone="hold"] .sl-cue-text b{color:var(--chalk);}

  /* ---------- set rows ---------- */
  .sl-setrow{
    display:grid;
    grid-template-columns:24px 1fr 1fr 30px;
    gap:6px;
    align-items:center;
    margin-bottom:9px;
  }
  .sl-setno{
    font-family:var(--mono);
    font-size:11px;
    color:var(--steel-dim);
    letter-spacing:.06em;
  }
  .sl-stepper{
    display:flex;
    align-items:center;
    background:var(--plate);
    border:1px solid var(--knurl);
    border-radius:3px;
    overflow:hidden;
  }
  .sl-stepper button{
    padding:13px 0;
    width:30px;
    flex-shrink:0;
    color:var(--steel);
    font-size:17px;
    line-height:1;
  }
  .sl-stepper button:hover{color:var(--amber);background:var(--plate-2);}
  .sl-stepper input{
    flex:1;
    min-width:0;
    width:100%;
    background:transparent;
    border:none;
    color:var(--chalk);
    font-family:var(--mono);
    font-size:16px;
    text-align:center;
    padding:11px 0;
    -moz-appearance:textfield;
  }
  .sl-stepper input::-webkit-outer-spin-button,
  .sl-stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .sl-unitrow{
    display:grid;
    grid-template-columns:24px 1fr 1fr 30px;
    gap:6px;
    margin-bottom:6px;
  }
  .sl-unitlabel{
    font-family:var(--mono);
    font-size:9px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--steel-dim);
    text-align:center;
  }

  /* ---------- history ---------- */
  .sl-spark{width:100%;height:56px;display:block;margin-top:12px;}
  .sl-hist-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding:11px 0;
    border-bottom:1px solid var(--knurl);
  }
  .sl-hist-date{
    font-family:var(--mono);
    font-size:11px;
    color:var(--steel-dim);
    letter-spacing:.06em;
    text-transform:uppercase;
    white-space:nowrap;
    padding-top:3px;
  }
  .sl-hist-sets{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;}

  /* ---------- library ---------- */
  .sl-libgroup{
    font-family:var(--display);
    font-size:15px;
    font-weight:600;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--amber);
    margin:24px 0 6px;
  }
  .sl-lib-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    border-bottom:1px solid var(--knurl);
  }
  .sl-lib-tap{
    flex:1;
    min-width:0;
    text-align:left;
    padding:12px 0;
  }
  .sl-lib-tap:hover .sl-pick-name{color:var(--amber);}
  .sl-lib-meta{
    font-family:var(--mono);
    font-size:10px;
    color:var(--steel-dim);
    letter-spacing:.05em;
    text-transform:uppercase;
    margin-top:3px;
  }

  .sl-field{margin-bottom:14px;}
  .sl-field label{
    display:block;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--steel-dim);
    margin-bottom:6px;
  }
  .sl-field input, .sl-field select{
    width:100%;
    background:var(--plate);
    border:1px solid var(--knurl);
    border-radius:3px;
    color:var(--chalk);
    padding:12px 13px;
    font-size:15px;
  }
  .sl-field-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .sl-hint{font-size:12px;color:var(--steel-dim);line-height:1.5;margin:-6px 0 14px;}

  .sl-toast{
    position:fixed;
    left:50%;
    bottom:26px;
    transform:translateX(-50%);
    background:var(--amber);
    color:#171310;
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:11px 18px;
    border-radius:3px;
    z-index:99;
    white-space:nowrap;
  }

  .sl-datafoot{margin-top:30px;padding-top:18px;border-top:1px solid var(--knurl);}

  .sl-nag{
    border:1px solid var(--amber-dim);
    background:rgba(240,180,41,.07);
    border-radius:3px;
    padding:13px 14px;
    margin-top:18px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .sl-nag-text{flex:1;min-width:180px;font-size:13px;line-height:1.5;color:var(--steel);}
  .sl-nag-text b{color:var(--chalk);font-weight:600;}
  .sl-nag-go{
    font-family:var(--display);
    font-size:15px;
    font-weight:700;
    letter-spacing:.10em;
    text-transform:uppercase;
    background:var(--amber);
    color:#171310;
    padding:10px 14px;
    border-radius:3px;
    flex-shrink:0;
  }

  .sl-status{
    font-family:var(--mono);
    font-size:11px;
    line-height:1.7;
    color:var(--steel-dim);
    margin-top:14px;
  }
  .sl-status b{color:var(--chalk);font-weight:500;}
  .sl-status i{font-style:normal;color:var(--amber);}

  .sl-toggle{
    font-family:var(--display);
    font-size:15px;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    padding:9px 18px;
    border-radius:3px;
    border:1px solid var(--knurl);
    color:var(--steel-dim);
    flex-shrink:0;
  }
  .sl-toggle[data-on="1"]{background:var(--amber);color:#171310;border-color:var(--amber);}

  /* ---------- calendar ---------- */

  function hostStore(){ return !!(window.storage && window.storage.get); }

    ["legs",  "Legs",  "Legs · calves · core",         "LEG",
      ["Legs","Core"]],
    ["upper", "Upper", "Chest · back · shoulders · arms","UPR",
      ["Chest","Back","Shoulders","Arms · Triceps","Arms · Biceps"]],
    ["lower", "Lower", "Legs · glutes · core",         "LWR",
      ["Legs","Core"]]
  ];
  function splitById(id){
    for(var i=0;i<SPLITS.length;i++){ if(SPLITS[i][0]===id) return SPLITS[i]; }
    return null;
  }
  function dayTypeOf(date){ return (state.data.days && state.data.days[date]) || null; }
  function dayName(s){ return DOW[parseISO(s).getDay()]; }
  function shortDate(s){ var d=parseISO(s); return MON[d.getMonth()]+" "+d.getDate(); }
  function daysAgo(s){
    var ms = parseISO(todayISO()) - parseISO(s);
    return Math.round(ms/86400000);
  }
  function agoText(s){
    var n = daysAgo(s);
    if(n===0) return "Earlier today";
    if(n===1) return "Yesterday";
    if(n<7) return n+" days ago";
    if(n<14) return "Last week";
    return Math.floor(n/7)+" weeks ago";
  }

  /* ============ lookups ============ */
  function ex(id){
    for(var i=0;i<state.data.exercises.length;i++){
      if(state.data.exercises[i].id===id) return state.data.exercises[i];
    }
    return null;
  }
  function sessionsFor(id){
    return state.data.sessions.filter(function(s){ return s.exerciseId===id; })
      .sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  }
  function sessionsOn(date){
    return state.data.sessions.filter(function(s){ return s.date===date; });
  }
  function topSet(sess){
    var best = sess.sets[0];
    for(var i=1;i<sess.sets.length;i++){
      if(sess.sets[i].w > best.w) best = sess.sets[i];
    }
    return best;
  }
  function topWeight(sess){ return topSet(sess).w; }

  /* The hardest set of a session. On a normal machine that's the heaviest weight.
     On an assisted pull-up or dip the stack counterweights you, so the LIGHTEST
     setting is the hard one and progress means the number going down. */
  function hardest(sess, e){
    var ws = sess.sets.map(function(s){ return s.w; });
    return (e && e.assist) ? Math.min.apply(null, ws) : Math.max.apply(null, ws);
  }
  function unitLabel(e){ return e && e.perSide ? "lb/side" : "lb"; }
  function volume(sess){
    return sess.sets.reduce(function(t,s){ return t + s.w*s.r; },0);
  }
  function wTxt(w){ return w>0 ? w+" lb" : "BW"; }

  /* the progressive-overload rule */
  function readiness(exercise, prev){
    if(!prev) return null;
    var w = hardest(prev, exercise);
    var atTop = prev.sets.filter(function(s){
      return exercise.assist ? s.w <= w : s.w >= w;
    });
    var cleared = atTop.length >= 2 && atTop.every(function(s){ return s.r >= exercise.target; });
    var next = exercise.assist
      ? Math.max(0, w - exercise.step)     // less help = harder
      : w + exercise.step;
    return {
      ready: cleared,
      weight: w,
      next: next,
      target: exercise.target,
      assist: !!exercise.assist
    };
  }

  /* ============ render ============ */
  function render(){
    document.getElementById("sl-clock").textContent =
      dayName(todayISO()).slice(0,3)+" "+shortDate(todayISO());
    var tabs = app.querySelectorAll(".sl-tab");
    for(var i=0;i<tabs.length;i++){
      tabs[i].setAttribute("data-on", tabs[i].getAttribute("data-tab")===state.tab ? "1" : "0");
    }
    if(state.tab==="today") renderToday();
    else if(state.tab==="history") renderHistory();
    else renderLibrary();
  }

  function renderToday(){
    var d = state.date;
    var todays = sessionsOn(d);
    var isToday = d===todayISO();
    var sets = todays.reduce(function(t,s){ return t+s.sets.length; },0);
    var vol = todays.reduce(function(t,s){ return t+volume(s); },0);

    var h = '';

    /* Nag, but only when there's genuinely something to lose. */
    var age = backupAge();
    if(age && (age.never ? age.days >= 3 : age.days >= 14)){
      var n = state.data.sessions.length;
      h += '<div class="sl-nag"><div class="sl-nag-text">';
      h += age.never
        ? '<b>'+n+' session'+(n>1?'s':'')+' logged, never backed up.</b> Clearing your browser data would erase all of it.'
        : '<b>Last backup was '+age.days+' days ago.</b> Anything since then is only on this phone.';
      h += '</div><button class="sl-nag-go" data-act="exportjson">Back up now</button></div>';
    }

    h += '<div class="sl-datestrip">';
    h += '<button data-act="day" data-n="-1" aria-label="Previous day">&#9664;</button>';
    h += '<button class="sl-datestrip-mid" data-act="cal" aria-label="Pick a date from the calendar">';
    h += '<div class="sl-datestrip-day">'+(isToday?"Today":dayName(d))+'</div>';
    h += '<div class="sl-datestrip-sub">'+shortDate(d)+' &nbsp;▾</div></button>';
    h += '<button data-act="day" data-n="1" aria-label="Next day"'+(isToday?' disabled':'')+'>&#9654;</button>';
    h += '</div>';

    if(!isInstalled() && !(state.data.meta && state.data.meta.hideInstallTip)){
      h += '<div class="sl-nag"><div class="sl-nag-text">';
      h += '<b>You\'re in a browser tab, not the installed app.</b> ';
      h += isIOS()
        ? 'Tap <b>Share</b>, then <b>Add to Home Screen</b>. Until you do, iOS clears this kind of storage after seven days of not opening the site — your log can vanish without you clearing anything.'
        : 'Use your browser menu, then <b>Add to Home screen</b>, to get it full-screen and working offline.';
      h += '</div><button class="sl-btn-quiet" data-act="hidetip">Got it</button></div>';
    }

    var dt = dayTypeOf(d);
    h += '<div class="sl-chips">';
    SPLITS.forEach(function(sp){
      h += '<button class="sl-chip" data-act="setsplit" data-split="'+sp[0]+'" data-on="'+
           (dt===sp[0]?"1":"0")+'">'+sp[1]+'</button>';
    });
    h += '</div>';
    if(dt){
      var spd = splitById(dt);
      h += '<div class="sl-splitnote">'+esc(spd[2])+' &nbsp;·&nbsp; tap again to clear</div>';
    }

    if(todays.length){
      h += '<div class="sl-daystat"><b>'+todays.length+'</b> exercise'+(todays.length>1?'s':'')+
           ' &nbsp;·&nbsp; <b>'+sets+'</b> sets &nbsp;·&nbsp; <b>'+vol.toLocaleString()+'</b> lb moved</div>';
      h += '<div class="sl-eyebrow">Logged</div>';
      todays.forEach(function(s){
        var e = ex(s.exerciseId);
        if(!e) return;
        var prior = sessionsFor(s.exerciseId).filter(function(p){ return p.date < s.date; });
        var isPR = prior.length && topWeight(s) > topWeight(prior[0]);
        h += '<div class="sl-entry" data-pr="'+(isPR?"1":"0")+'">';
        h += '<div class="sl-entry-head"><div>';
        h += '<div class="sl-entry-name">'+esc(e.name)+'</div>';
        h += '<div class="sl-entry-gear">'+esc(e.gear)+'</div>';
        h += '</div><button class="sl-icon-btn" data-act="del" data-id="'+s.id+'">Remove</button></div>';
        h += '<div class="sl-sets">';
        s.sets.forEach(function(st){
          h += '<div class="sl-set-chip">'+(st.w>0?st.w:'BW')+'<span> × </span>'+st.r+'</div>';
        });
        h += '</div>';
        if(isPR) h += '<div class="sl-pr-flag">↑ Heaviest yet — up from '+topWeight(prior[0])+' lb</div>';
        h += '</div>';
      });
    } else {
      h += '<div class="sl-empty"><strong>Nothing logged</strong>'+
           (isToday ? 'Pick an exercise and put the first set down.' : 'No training recorded on this day.')+'</div>';
    }

    h += '<div style="margin-top:14px"><button class="sl-btn" data-act="pick">+ Log an exercise</button></div>';

    if(state.data.sessions.length){
      var a = backupAge();
      var when = !a ? '' : (a.never ? ' · never backed up'
              : (a.days === 0 ? ' · backed up today' : ' · last backup ' + a.days + 'd ago'));
      h += '<div style="margin-top:10px"><button class="sl-btn-ghost" data-act="exportjson">'+
           'Back up log'+when+'</button></div>';
    }

    pageEl.innerHTML = h;
  }

  function renderHistory(){
    var trained = state.data.exercises.filter(function(e){
      return sessionsFor(e.id).length > 0;
    });
    if(!trained.length){
      pageEl.innerHTML = '<div class="sl-empty" style="margin-top:40px"><strong>No history yet</strong>'+
        'Once you log a session or two, every exercise gets its own record here.</div>';
      return;
    }
    if(state.histId && ex(state.histId)) return renderHistoryDetail(ex(state.histId));

    trained.sort(function(a,b){
      return sessionsFor(a.id)[0].date < sessionsFor(b.id)[0].date ? 1 : -1;
    });
    var h = '<div class="sl-eyebrow">Every exercise you\'ve trained</div>';
    trained.forEach(function(e){
      var ss = sessionsFor(e.id);
      var last = ss[0];
      h += '<button class="sl-pick" data-act="hist" data-id="'+e.id+'">';
      h += '<div><div class="sl-pick-name">'+esc(e.name)+'</div>';
      h += '<div class="sl-pick-gear">'+esc(e.gear)+' · '+ss.length+' session'+(ss.length>1?'s':'')+'</div></div>';
      h += '<div class="sl-pick-last">'+hardest(last, e)+' <small style="display:inline;font-size:9px">'+unitLabel(e)+'</small><small>'+agoText(last.date)+'</small></div>';
      h += '</button>';
    });
    pageEl.innerHTML = h;
  }

  function renderHistoryDetail(e){
    var ss = sessionsFor(e.id);
    var chron = ss.slice().reverse();
    var best = hardest(chron[0], e), bestDate = chron[0].date;
    chron.forEach(function(s){
      var w = hardest(s, e);
      if(e.assist ? w <= best : w >= best){ best = w; bestDate = s.date; }
    });
    var first = hardest(chron[0], e);
    var gain = e.assist ? (first - best) : (best - first);

    var h = '<div style="margin-top:18px"><button class="sl-btn-quiet" data-act="histback">← All exercises</button></div>';
    h += '<div style="margin-top:18px"><div class="sl-entry-name" style="font-size:26px">'+esc(e.name)+'</div>';
    h += '<div class="sl-entry-gear">'+esc(e.gear)+'</div>';
    h += '<div class="sl-entry-gear">target '+e.target+' reps · steps of '+e.step+' '+unitLabel(e)+(e.assist?' assistance':'')+'</div></div>';

    h += '<div class="sl-eyebrow">Working weight over time</div>';
    h += spark(chron, e);
    h += '<div class="sl-daystat" style="display:flex;gap:18px;flex-wrap:wrap">';
    h += '<span>'+(e.assist?'Least help':'Best')+' <b>'+best+' '+unitLabel(e)+'</b> · '+shortDate(bestDate)+'</span>';
    h += '<span>Started <b>'+first+' '+unitLabel(e)+'</b></span>';
    if(gain>0) h += '<span style="color:var(--amber)">'+(e.assist?'−':'+')+gain+' lb</span>';
    h += '</div>';

    h += '<div class="sl-eyebrow">Session by session</div>';
    ss.forEach(function(s){
      h += '<div class="sl-hist-row"><div class="sl-hist-date">'+shortDate(s.date)+'</div><div class="sl-hist-sets">';
      s.sets.forEach(function(st){
        h += '<div class="sl-set-chip">'+(st.w>0?st.w:'BW')+'<span>×</span>'+st.r+'</div>';
      });
      h += '</div></div>';
    });
    pageEl.innerHTML = h;
  }

  function spark(chron, e){
    if(chron.length < 2) return '<div class="sl-hint" style="margin-top:10px">One session so far — the line shows up after the second.</div>';
    var w = 520, hh = 56, pad = 4;
    var vals = chron.map(function(s){ return hardest(s, e); });
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    if(mx===mn){ mx = mn+1; }
    var pts = vals.map(function(v,i){
      var x = pad + i*(w-pad*2)/(vals.length-1);
      var y = hh-pad - (v-mn)/(mx-mn)*(hh-pad*2);
      return [x,y];
    });
    var d = pts.map(function(p,i){ return (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1); }).join(" ");
    var s = '<svg class="sl-spark" viewBox="0 0 '+w+' '+hh+'" preserveAspectRatio="none" aria-hidden="true">';
    s += '<path d="'+d+'" fill="none" stroke="#F0B429" stroke-width="2" vector-effect="non-scaling-stroke"/>';
    pts.forEach(function(p,i){
      var lastOne = i===pts.length-1;
      s += '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(lastOne?4:2.5)+'" fill="'+(lastOne?"#F0B429":"#5E686F")+'"/>';
    });
    s += '</svg>';
    return s;
  }

  function renderLibrary(){
    var lfx = state.libFilter || "all";
    var groups = {};
    state.data.exercises.forEach(function(e){
      if(lfx !== "all" && e.eq !== lfx) return;
      (groups[e.muscle] = groups[e.muscle] || []).push(e);
    });
    var order = ["Chest","Back","Shoulders","Arms · Triceps","Arms · Biceps","Legs","Core"];
    Object.keys(groups).forEach(function(k){ if(order.indexOf(k)<0) order.push(k); });

    var lf = state.libFilter || "all";
    var h = '<div class="sl-chips" style="margin-top:16px">';
    EQ.forEach(function(pair){
      h += '<button class="sl-chip" data-act="libfilter" data-eq="'+pair[0]+'" data-on="'+
           (lf===pair[0]?"1":"0")+'">'+pair[1]+'</button>';
    });
    h += '</div>';
    h += '<div style="margin-top:14px"><button class="sl-btn-ghost" data-act="newex">+ Add your own exercise</button></div>';
    order.forEach(function(m){
      if(!groups[m]) return;
      h += '<div class="sl-libgroup">'+esc(m)+'</div>';
      groups[m].forEach(function(e){
        var n = sessionsFor(e.id).length;
        h += '<div class="sl-lib-row"><button class="sl-lib-tap" data-act="choose" data-id="'+e.id+'">';
        h += '<div class="sl-pick-name" style="font-size:18px">'+esc(e.name)+'</div>';
        h += '<div class="sl-lib-meta">'+esc(e.gear)+'</div>';
        h += '<div class="sl-lib-meta">target '+e.target+' reps · '+(e.assist?'−':'+')+e.step+' '+unitLabel(e)+
             (n?' · '+n+' logged':'')+'</div>';
        h += '</button><button class="sl-btn-quiet" data-act="editex" data-id="'+e.id+'">Edit</button></div>';
      });
    });

    var autoOn = !(state.data.meta && state.data.meta.autoBackup === false);
    h += '<div class="sl-eyebrow">Cloud sync</div>';
    h += cloudPanel();

    h += '<div class="sl-eyebrow">Keeping your log safe</div>';
    h += '<div class="sl-card" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">';
    h += '<div style="flex:1;min-width:170px">';
    h += '<div style="font-size:14px;font-weight:600;margin-bottom:4px">Auto-backup after each workout</div>';
    h += '<div style="font-size:12px;line-height:1.5;color:var(--steel-dim)">Saves a copy to your Downloads folder the first time you log each day. Downloads survive clearing your browser data.</div>';
    h += '</div>';
    h += '<button class="sl-toggle" data-act="autotoggle" data-on="'+(autoOn?"1":"0")+'">'+(autoOn?'On':'Off')+'</button>';
    h += '</div>';

    h += '<div class="sl-datafoot"><button class="sl-btn" data-act="exportjson">Back up now</button></div>';
    h += '<div style="margin-top:10px"><button class="sl-btn-ghost" data-act="import">Restore from a backup</button></div>';
    h += '<div style="margin-top:10px"><button class="sl-btn-ghost" data-act="export">Export CSV for analysis</button></div>';
    h += '<input type="file" id="sl-file" accept="application/json,.json" style="display:none">';
    var age2 = backupAge();
    h += '<div class="sl-status">';
    h += 'Sessions stored: <b>'+state.data.sessions.length+'</b><br>';
    h += 'Last backup: <b>'+(age2 && !age2.never ? age2.days+' days ago' :
         (state.data.sessions.length ? '<i>never</i>' : '—'))+'</b><br>';
    h += 'Eviction protection: <b>'+(state.persisted===null ? 'checking…' :
         (state.persisted ? 'on' : '<i>off</i>'))+'</b>';
    h += '</div>';
    h += '<div class="sl-hint" style="margin-top:12px">Your log is saved in this browser only — it is not in the repo and not on a server. <b style="color:var(--chalk);font-weight:600">Clearing cookies and site data in Chrome will erase it.</b> Clearing browsing history alone will not. Export a backup regularly and keep the file somewhere off this phone; Restore backup reads it straight back.</div>';
    pageEl.innerHTML = h;
  }

  /* ============ sheets ============ */
  var backFromPop = false;

  function closeSheet(fromPop){
    sheetMount.innerHTML = "";
    state.draft = null;
    state.query = "";
    if(state.sheetOpen && !fromPop){
      state.sheetOpen = false;
      backFromPop = true;              // our own history.back, not a user gesture
      try { history.back(); } catch(err){ backFromPop = false; }
    } else {
      state.sheetOpen = false;
    }
  }

  /* The phone's back gesture should close the sheet, not leave the app. */
  window.addEventListener("popstate", function(){
    if(backFromPop){ backFromPop = false; return; }
    if(state.sheetOpen) closeSheet(true);
  });

  /* noAnim: re-renders of an already-open sheet must not replay the entrance
     animation, or every tap on a stepper looks like a flash. */
  function openSheet(title, bodyHTML, closeLabel, noAnim){
    var label = closeLabel || "Close";
    sheetMount.innerHTML =
      '<div class="sl-sheet"'+(noAnim ? ' data-anim="0"' : '')+' role="dialog" aria-modal="true">'+
        '<div class="sl-sheet-bar">'+
          '<button class="sl-back" data-act="close" aria-label="'+label+'">&#8592;</button>'+
          '<div class="sl-sheet-title">'+title+'</div>'+
        '</div>'+
        '<div class="sl-sheet-body">'+bodyHTML+
          '<button class="sl-sheet-cancel" data-act="close">'+label+'</button>'+
        '</div>'+
      '</div>';
    if(!state.sheetOpen){
      state.sheetOpen = true;
      try { history.pushState({ sheet: 1 }, ""); } catch(err){}
    }
    if(!noAnim) sheetMount.querySelector(".sl-sheet").scrollTop = 0;
  }

  /* Equipment filters. With 130-odd exercises, scrolling by muscle alone is too slow —
     but you already know which machine you're standing at. */
  var EQ = [
    ["all",     "All"],
    ["Cable",   "Cable"],
    ["Machine", "Machine"],
    ["Hammer",  "Hammer"],
    ["Smith",   "Smith"],
    ["Dumbbell","Dumbbell"],
    ["Bar",     "Fixed bar"],
    ["Body",    "Bodyweight"]
  ];

  function recentExercises(limit){
    var seen = {}, out = [];
    state.data.sessions.slice()
      .sort(function(a,b){ return a.date < b.date ? 1 : -1; })
      .forEach(function(sess){
        if(out.length >= limit || seen[sess.exerciseId]) return;
        var e = ex(sess.exerciseId);
        if(!e) return;
        seen[sess.exerciseId] = 1;
        out.push(e);
      });
    return out;
  }

  function pickRow(e){
    var ss = sessionsFor(e.id);
    var b = '<button class="sl-pick" data-act="choose" data-id="'+e.id+'">';
    b += '<div><div class="sl-pick-name">'+esc(e.name)+'</div><div class="sl-pick-gear">'+esc(e.gear)+'</div></div>';
    b += ss.length
      ? '<div class="sl-pick-last">'+hardest(ss[0], e)+'<small>'+agoText(ss[0].date)+'</small></div>'
      : '<div class="sl-pick-last" style="color:var(--steel-dim)">—<small>New</small></div>';
    b += '</button>';
    return b;
  }

  function openPicker(noAnim){
    var q = state.query.toLowerCase().trim();
    var filt = state.eqFilter || "all";

    var dayT = dayTypeOf(state.date);
    var sp = dayT ? splitById(dayT) : null;
    var splitMuscles = (filt === "split" && sp) ? sp[4] : null;

    function fits(e){
      if(splitMuscles && splitMuscles.indexOf(e.muscle) < 0) return false;
      if(filt !== "all" && filt !== "split" && e.eq !== filt) return false;
      return !q || (e.name+" "+e.gear+" "+e.muscle).toLowerCase().indexOf(q) >= 0;
    }

    var list = state.data.exercises.filter(fits);

    var b = '<input class="sl-search" id="sl-q" placeholder="Search exercise, machine or setting…" value="'+esc(state.query)+'" autocomplete="off">';

    if(sp){
      b += '<div class="sl-chips">';
      b += '<button class="sl-chip" data-act="eqfilter" data-eq="split" data-on="'+
           (filt==="split"?"1":"0")+'">'+sp[1]+' day only</button>';
      b += '<button class="sl-chip" data-act="eqfilter" data-eq="all" data-on="'+
           (filt==="all"?"1":"0")+'">Everything</button>';
      b += '</div>';
    }

    b += '<div class="sl-chips">';
    EQ.forEach(function(pair){
      b += '<button class="sl-chip" data-act="eqfilter" data-eq="'+pair[0]+'" data-on="'+
           (filt===pair[0]?"1":"0")+'">'+pair[1]+'</button>';
    });
    b += '</div>';

    /* What you've actually been doing beats an alphabetical list. */
    if(!q){
      var rec = recentExercises(12).filter(fits).slice(0,6);
      if(rec.length){
        b += '<div class="sl-libgroup">Recent</div>';
        rec.forEach(function(e){ b += pickRow(e); });
      }
    }

    if(!list.length){
      b += '<div class="sl-empty"><strong>No match</strong>'+
           (splitMuscles ? 'Nothing here for a '+sp[1].toLowerCase()+' day. Tap <b>Everything</b> above to see the full library.'
                         : 'Nothing fits that. Try a different word, or add it yourself from the Exercises tab.')+
           '</div>';
    }

    var lastMuscle = "";
    list.forEach(function(e){
      if(e.muscle !== lastMuscle){ b += '<div class="sl-libgroup">'+esc(e.muscle)+'</div>'; lastMuscle = e.muscle; }
      b += pickRow(e);
    });

    openSheet("Pick an exercise", b, "Cancel", noAnim);

    var qi = document.getElementById("sl-q");
    qi.addEventListener("input", function(){
      state.query = qi.value;
      var pos = qi.selectionStart;
      openPicker(true);
      var ni = document.getElementById("sl-q");
      ni.focus(); ni.setSelectionRange(pos,pos);
    });
  }

  function openLogger(exerciseId){
    var e = ex(exerciseId);
    var hist = sessionsFor(exerciseId).filter(function(s){ return s.date !== state.date; });
    var prev = hist[0] || null;
    var r = readiness(e, prev);

    if(!state.draft || state.draft.exerciseId !== exerciseId){
      var startW = prev ? (r.ready ? r.next : topWeight(prev)) : 0;
      var startR = prev ? e.target : e.target;
      state.draft = { exerciseId: exerciseId, sets:[{w:startW, r:startR}] };
    }
    drawLogger(e, prev, r);
  }

  function drawLogger(e, prev, r, noAnim){
    var b = '';

    /* last time */
    b += '<div class="sl-lasttime">';
    if(prev){
      var pw = hardest(prev, e);
      b += '<div class="sl-lasttime-label"><span>'+(e.assist?'Last time · assistance':'Last time')+'</span><span>'+agoText(prev.date)+'</span></div>';
      b += '<div class="sl-lasttime-load">'+(pw>0?pw:'BW')+'<small>'+(pw>0?unitLabel(e):'')+'</small></div>';
      b += '<div class="sl-sets">';
      prev.sets.forEach(function(st){
        b += '<div class="sl-set-chip">'+(st.w>0?st.w:'BW')+'<span> × </span>'+st.r+'</div>';
      });
      b += '</div>';
    } else {
      b += '<div class="sl-lasttime-label"><span>First time</span><span>No history</span></div>';
      b += '<div class="sl-cue-text" style="color:var(--steel)">Pick a weight you can control for '+e.target+
           ' clean reps. Whatever you log becomes the baseline everything else is measured against.</div>';
    }
    b += '</div>';

    /* THE STACK */
    if(prev){
      var chron = sessionsFor(e.id).filter(function(s){ return s.date !== state.date; }).slice(0,7).reverse();
      var weights = chron.map(function(s){ return hardest(s, e); });
      var mx = Math.max.apply(null, weights.concat([r.next]));
      b += '<div class="sl-stack"><div class="sl-eyebrow">The stack · last '+chron.length+' session'+(chron.length>1?'s':'')+'</div>';
      b += '<div class="sl-stack-rail">';
      chron.forEach(function(s,i){
        var w = hardest(s, e);
        var pct = mx>0 ? Math.max(28, Math.round(w/mx*100)) : 40;
        var cur = i===chron.length-1;
        b += '<div class="sl-plate-row">';
        b += '<div class="sl-plate" style="width:'+pct+'%" data-cur="'+(cur?"1":"0")+'">'+(w>0?w:'BW')+'</div>';
        b += '<div class="sl-plate-tag"'+(cur?' data-hot="1"':'')+'>'+(cur?'◄ where you left off':shortDate(s.date))+'</div>';
        b += '</div>';
      });
      if(r.ready){
        var np = mx>0 ? Math.max(30, Math.round(r.next/mx*100)) : 45;
        b += '<div class="sl-plate-row">';
        b += '<div class="sl-plate" style="width:'+np+'%" data-next="1">'+r.next+'</div>';
        b += '<div class="sl-plate-tag" data-hot="1">go here today</div>';
        b += '</div>';
      }
      b += '</div>';

      if(r.ready){
        b += '<div class="sl-cue"><div class="sl-cue-mark">'+(r.assist?'↓':'↑')+'</div><div class="sl-cue-text">You hit <b>'+e.target+
             ' reps on every working set</b> at '+r.weight+' '+unitLabel(e)+'. '+
             (r.assist
               ? 'Take the help down — go for <b>'+r.next+' lb of assistance</b> today.'
               : 'Add the next plate — go for <b>'+r.next+' '+unitLabel(e)+'</b> today.')+
             '</div></div>';
      } else {
        b += '<div class="sl-cue" data-tone="hold"><div class="sl-cue-mark">=</div><div class="sl-cue-text">Stay at <b>'+
             r.weight+' '+unitLabel(e)+'</b>. Once every working set reaches <b>'+e.target+' reps</b>, '+
             (r.assist?'the assistance comes down':'the weight goes up')+'.</div></div>';
      }
      b += '</div>';
    }

    /* set entry */
    b += '<div class="sl-eyebrow">Today\'s sets</div>';
    b += '<div class="sl-unitrow"><div></div><div class="sl-unitlabel">'+
         (e.assist ? 'Assistance (lb)' : (e.perSide ? 'Weight (lb per side)' : 'Weight (lb)'))+
         '</div><div class="sl-unitlabel">Reps</div><div></div></div>';
    state.draft.sets.forEach(function(s,i){
      b += '<div class="sl-setrow">';
      b += '<div class="sl-setno">'+pad(i+1)+'</div>';
      b += '<div class="sl-stepper"><button data-act="w" data-i="'+i+'" data-n="-1" aria-label="Less weight">−</button>'+
           '<input type="number" inputmode="decimal" data-fld="w" data-i="'+i+'" value="'+s.w+'" aria-label="Set '+(i+1)+' weight">'+
           '<button data-act="w" data-i="'+i+'" data-n="1" aria-label="More weight">+</button></div>';
      b += '<div class="sl-stepper"><button data-act="r" data-i="'+i+'" data-n="-1" aria-label="Fewer reps">−</button>'+
           '<input type="number" inputmode="numeric" data-fld="r" data-i="'+i+'" value="'+s.r+'" aria-label="Set '+(i+1)+' reps">'+
           '<button data-act="r" data-i="'+i+'" data-n="1" aria-label="More reps">+</button></div>';
      b += state.draft.sets.length>1
        ? '<button class="sl-icon-btn" data-act="rmset" data-i="'+i+'" aria-label="Remove set '+(i+1)+'">✕</button>'
        : '<div></div>';
      b += '</div>';
    });
    b += '<div style="margin-top:12px"><button class="sl-btn-ghost" data-act="addset">+ Add set</button></div>';
    b += '<div style="margin-top:12px"><button class="sl-btn" data-act="savelog">Save to '+
         (state.date===todayISO()?'today':shortDate(state.date))+'</button></div>';

    openSheet(esc(e.name)+'<div class="sl-sheet-sub">'+esc(e.gear)+'</div>', b, "Cancel", noAnim);
  }

  /* Calendar. Days you trained are marked, so this doubles as a consistency view —
     you can see the gaps as well as jump to a date. */
  function openCalendar(){
    var cm = state.calMonth || state.date.slice(0,7);
    var y = +cm.slice(0,4), m = +cm.slice(5,7) - 1;
    var startDow = new Date(y, m, 1).getDay();
    var dim = new Date(y, m + 1, 0).getDate();
    var today = todayISO();
    var thisMonth = today.slice(0,7);

    var trained = {};
    state.data.sessions.forEach(function(s){
      trained[s.date] = (trained[s.date] || 0) + s.sets.length;
    });

    var b = '<div class="sl-calhead">';
    b += '<button data-act="calshift" data-n="-1" aria-label="Previous month">&#9664;</button>';
    b += '<div class="sl-calmonth">'+MONFULL[m]+' '+y+'</div>';
    b += '<button data-act="calshift" data-n="1" aria-label="Next month"'+
         (cm >= thisMonth ? ' disabled' : '')+'>&#9654;</button>';
    b += '</div>';

    b += '<div class="sl-calgrid">';
    ["S","M","T","W","T","F","S"].forEach(function(d){
      b += '<div class="sl-caldow">'+d+'</div>';
    });
    for(var i = 0; i < startDow; i++) b += '<div></div>';

    var daysTrained = 0, setsThisMonth = 0;
    for(var d = 1; d <= dim; d++){
      var iso = y+"-"+pad(m+1)+"-"+pad(d);
      var future = iso > today;
      var count = trained[iso] || 0;
      if(count){ daysTrained++; setsThisMonth += count; }
      var sType = dayTypeOf(iso);
      var sDef = sType ? splitById(sType) : null;
      b += '<button class="sl-calday" data-act="calpick" data-date="'+iso+'"'+
           (future ? ' disabled' : '')+
           ' data-sel="'+(iso === state.date ? "1" : "0")+'"'+
           ' data-today="'+(iso === today ? "1" : "0")+'"'+
           ' data-has="'+(count ? "1" : "0")+'">'+d+
           (sDef ? '<u>'+sDef[3]+'</u>' : (count ? '<i></i>' : ''))+'</button>';
    }
    b += '</div>';

    b += '<div class="sl-calstat">';
    b += daysTrained
      ? '<b>'+daysTrained+'</b> day'+(daysTrained>1?'s':'')+' trained in '+MONFULL[m]+
        ' &nbsp;·&nbsp; <b>'+setsThisMonth+'</b> sets'
      : 'Nothing logged in '+MONFULL[m]+' yet';

    /* Split balance — the number that tells you whether you're skipping leg day. */
    var tally = {}, anySplit = false;
    Object.keys(state.data.days || {}).forEach(function(iso2){
      if(iso2.slice(0,7) !== cm) return;
      var k = state.data.days[iso2];
      tally[k] = (tally[k] || 0) + 1;
      anySplit = true;
    });
    if(anySplit){
      var parts = [];
      SPLITS.forEach(function(spx){
        if(tally[spx[0]]) parts.push(spx[1]+' <b>'+tally[spx[0]]+'</b>');
      });
      b += '<div style="margin-top:8px">'+parts.join(' &nbsp;·&nbsp; ')+'</div>';
    }
    b += '</div>';

    if(state.date !== today){
      b += '<div style="margin-top:16px"><button class="sl-btn" data-act="calpick" data-date="'+today+'">Back to today</button></div>';
    }

    openSheet("Pick a date", b, "Close");
  }

  function openExerciseForm(id){
    var e = id ? ex(id) : null;
    var b = '<div style="margin-top:18px"></div>';
    b += '<div class="sl-field"><label>Exercise name</label><input id="f-name" value="'+esc(e?e.name:'')+'" placeholder="e.g. Tricep pushdown"></div>';
    b += '<div class="sl-field"><label>Machine or equipment</label><input id="f-gear" value="'+esc(e?e.gear:'')+'" placeholder="e.g. Cable · rope"></div>';
    b += '<div class="sl-hint">Note the exact attachment or seat setting — a rope pushdown and a bar pushdown are not the same lift.</div>';
    b += '<div class="sl-field"><label>Muscle group</label><select id="f-muscle">';
    ["Chest","Back","Shoulders","Arms · Triceps","Arms · Biceps","Legs","Core"].forEach(function(m){
      b += '<option'+(e&&e.muscle===m?' selected':'')+'>'+m+'</option>';
    });
    b += '</select></div>';
    b += '<div class="sl-field-pair">';
    b += '<div class="sl-field"><label>Target reps</label><input type="number" id="f-target" value="'+(e?e.target:10)+'"></div>';
    b += '<div class="sl-field"><label>Weight step (lb)</label><input type="number" id="f-step" value="'+(e?e.step:5)+'"></div>';
    b += '</div>';
    b += '<div class="sl-hint">When every working set reaches your target reps, the app tells you to add one step of weight.</div>';
    b += '<button class="sl-btn" data-act="saveex" data-id="'+(id||'')+'">'+(e?'Save changes':'Add exercise')+'</button>';
    if(e){
      b += '<div style="margin-top:22px"><button class="sl-btn-quiet" data-act="delex" data-id="'+id+'">Delete exercise and its history</button></div>';
    }
    openSheet(e?"Edit exercise":"New exercise", b, "Cancel");
  }

  /* ============ actions ============ */
  function commit(msg){
    save().then(function(){ if(msg) toast(msg); });
    render();
  }

  function toast(msg){
    toastMount.innerHTML = '<div class="sl-toast">'+esc(msg)+'</div>';
    setTimeout(function(){ toastMount.innerHTML = ""; }, 2200);
  }

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

  app.addEventListener("click", function(evt){
    var t = evt.target.closest("[data-act], [data-tab]");
    if(!t) return;
    var act = t.getAttribute("data-act");
    var tab = t.getAttribute("data-tab");

    if(tab){ state.tab = tab; state.histId = null; render(); return; }

    if(act==="day"){ state.date = shiftISO(state.date, +t.getAttribute("data-n")); render(); return; }
    if(act==="hidetip"){
      state.data.meta = state.data.meta || {};
      state.data.meta.hideInstallTip = true;
      commit();
      return;
    }
    if(act==="setsplit"){
      var sid = t.getAttribute("data-split");
      state.data.days = state.data.days || {};
      if(state.data.days[state.date] === sid) delete state.data.days[state.date];
      else state.data.days[state.date] = sid;
      commit();
      return;
    }
    if(act==="cal"){ state.calMonth = state.date.slice(0,7); openCalendar(); return; }
    if(act==="calshift"){
      var cy = +state.calMonth.slice(0,4), cmo = +state.calMonth.slice(5,7) - 1 + (+t.getAttribute("data-n"));
      var nd = new Date(cy, cmo, 1);
      state.calMonth = nd.getFullYear()+"-"+pad(nd.getMonth()+1);
      openCalendar();
      return;
    }
    if(act==="calpick"){
      state.date = t.getAttribute("data-date");
      state.calMonth = state.date.slice(0,7);
      closeSheet();
      render();
      return;
    }
    if(act==="close"){ closeSheet(); return; }
    if(act==="pick"){
      state.query = "";
      state.eqFilter = dayTypeOf(state.date) ? "split" : "all";
      openPicker();
      return;
    }
    if(act==="eqfilter"){ state.eqFilter = t.getAttribute("data-eq"); openPicker(true); return; }
    if(act==="libfilter"){ state.libFilter = t.getAttribute("data-eq"); render(); return; }
    if(act==="choose"){ openLogger(t.getAttribute("data-id")); return; }
    if(act==="hist"){ state.histId = t.getAttribute("data-id"); render(); return; }
    if(act==="histback"){ state.histId = null; render(); return; }
    if(act==="newex"){ openExerciseForm(null); return; }
    if(act==="editex"){ openExerciseForm(t.getAttribute("data-id")); return; }

    if(act==="w" || act==="r"){
      var i = +t.getAttribute("data-i"), n = +t.getAttribute("data-n");
      var e = ex(state.draft.exerciseId);
      var s = state.draft.sets[i];
      if(act==="w") s.w = Math.max(0, Math.round((s.w + n*e.step) * 100) / 100);
      else s.r = Math.max(1, s.r + n);
      /* Write straight into the input. Redrawing the whole sheet for one tap was
         what made the screen flash on every press. */
      var fld = sheetMount.querySelector('input[data-fld="'+act+'"][data-i="'+i+'"]');
      if(fld) fld.value = (act === "w" ? s.w : s.r);
      else redrawLogger(true);
      return;
    }
    if(act==="addset"){
      var last = state.draft.sets[state.draft.sets.length-1];
      state.draft.sets.push({w:last.w, r:last.r});
      redrawLogger(true);
      return;
    }
    if(act==="rmset"){
      state.draft.sets.splice(+t.getAttribute("data-i"),1);
      redrawLogger(true);
      return;
    }

    if(act==="savelog"){
      var exId = state.draft.exerciseId;
      var clean = state.draft.sets.filter(function(s){ return s.r > 0; });
      if(!clean.length){ toast("Add at least one set"); return; }
      state.data.sessions = state.data.sessions.filter(function(s){
        return !(s.exerciseId===exId && s.date===state.date);
      });
      state.data.sessions.push({ id:uid(), date:state.date, exerciseId:exId, sets:clean });
      autoBackup();
      closeSheet();
      commit("Saved");
      if(cloud.user) syncNow(true);
      return;
    }

    if(act==="del"){
      var sid = t.getAttribute("data-id");
      state.data.sessions = state.data.sessions.filter(function(s){ return s.id !== sid; });
      commit("Removed");
      return;
    }

    if(act==="saveex"){
      var id = t.getAttribute("data-id");
      var name = document.getElementById("f-name").value.trim();
      if(!name){ toast("Give it a name"); return; }
      var rec = {
        id: id || uid(),
        slug: (e && e.slug) || slugify(name) + "-" + Math.random().toString(36).slice(2,5),
        name: name,
        gear: document.getElementById("f-gear").value.trim() || "Free weight",
        muscle: document.getElementById("f-muscle").value,
        target: Math.max(1, +document.getElementById("f-target").value || 10),
        step: Math.max(0.5, +document.getElementById("f-step").value || 5)
      };
      if(id){
        state.data.exercises = state.data.exercises.map(function(x){ return x.id===id ? rec : x; });
      } else {
        state.data.exercises.push(rec);
      }
      closeSheet();
      commit(id ? "Updated" : "Added to your library");
      return;
    }

    if(act==="delex"){
      var xid = t.getAttribute("data-id");
      state.data.exercises = state.data.exercises.filter(function(x){ return x.id!==xid; });
      state.data.sessions = state.data.sessions.filter(function(s){ return s.exerciseId!==xid; });
      closeSheet();
      state.histId = null;
      commit("Deleted");
      return;
    }

    if(act==="autotoggle"){
      state.data.meta = state.data.meta || {};
      var was = state.data.meta.autoBackup !== false;
      state.data.meta.autoBackup = !was;
      commit(was ? "Auto-backup off" : "Auto-backup on");
      return;
    }
    if(act==="signin"){
      var box = document.getElementById("sl-email");
      var addr = cleanEmail(box ? box.value : "");
      if(!addr || !isValidEmail(addr)){ cloud.error = "Enter a valid email like name@example.com"; render(); return; }
      cloud.error = null;
      sb.auth.signInWithOtp({
        email: addr,
        options: { emailRedirectTo: location.href.split("#")[0].split("?")[0] }
      }).then(function(r){
        if(r.error){ cloud.error = r.error.message; render(); return; }
        toast("Check your email");
      });
      return;
    }
    if(act==="signout"){
      sb.auth.signOut().then(function(){ cloud.user = null; render(); });
      return;
    }
    if(act==="syncnow"){ syncNow(false); return; }
    if(act==="export"){ exportCSV(); return; }
    if(act==="exportjson"){ exportJSON(); return; }
    if(act==="import"){ document.getElementById("sl-file").click(); return; }
  });

  app.addEventListener("change", function(evt){
    if(evt.target.id !== "sl-file") return;
    var file = evt.target.files && evt.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var incoming = safeParse(reader.result);
      if(!incoming || !incoming.exercises){ toast("That file isn't a Strength Log backup"); return; }
      state.data = { exercises: incoming.exercises, sessions: incoming.sessions || [] };
      state.histId = null;
      commit("Restored " + state.data.sessions.length + " sessions");
    };
    reader.onerror = function(){ toast("Couldn't read that file"); };
    reader.readAsText(file);
  });

  app.addEventListener("input", function(evt){
    var t = evt.target;
    var fld = t.getAttribute && t.getAttribute("data-fld");
    if(!fld || !state.draft) return;
    var i = +t.getAttribute("data-i");
    var v = parseFloat(t.value);
    if(isNaN(v)) v = 0;
    if(fld==="w") state.draft.sets[i].w = Math.max(0, v);
    else state.draft.sets[i].r = Math.max(0, Math.round(v));
  });

  function redrawLogger(noAnim){
    var e = ex(state.draft.exerciseId);
    var hist = sessionsFor(e.id).filter(function(s){ return s.date !== state.date; });
    var prev = hist[0] || null;
    var scroller = sheetMount.querySelector(".sl-sheet");
    var y = scroller ? scroller.scrollTop : 0;
    drawLogger(e, prev, readiness(e, prev), noAnim);
    var ns = sheetMount.querySelector(".sl-sheet");
    if(ns) ns.scrollTop = y;
  }

  /* ============ export ============ */
  function download(name, text, mime){
    var blob = new Blob([text], {type:mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  function exportCSV(){
    var rows = [["date","day_type","exercise","equipment","muscle","set","weight_lb","reps"]];
    state.data.sessions.slice().sort(function(a,b){ return a.date<b.date?-1:1; }).forEach(function(s){
      var e = ex(s.exerciseId); if(!e) return;
      s.sets.forEach(function(st,i){
        rows.push([s.date, dayTypeOf(s.date) || "", e.name, e.gear, e.muscle, i+1, st.w, st.r]);
      });
    });
    if(rows.length===1){ toast("Nothing to export yet"); return; }
    var csv = rows.map(function(r){
      return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(",");
    }).join("\n");
    download("strength-log-"+todayISO()+".csv", csv, "text/csv");
    toast("CSV downloaded");
  }
  /* Automatic backup.
     Fires straight after you save a workout, so it runs inside the tap that saved it —
     browsers only allow downloads during a real user gesture. The file lands in Downloads,
     which lives outside the browser and survives clearing cookies and site data.
     One file per training day: the same day's file just gets rewritten. */
  function autoBackup(){
    var m = state.data.meta = state.data.meta || {};
    if(m.autoBackup === false) return;
    if(m.lastAuto === todayISO()) return;      // already captured today
    try {
      download("strength-log-"+todayISO()+".json",
               JSON.stringify(state.data,null,2), "application/json");
      m.lastAuto = todayISO();
      m.lastBackup = todayISO();
    } catch(e){ /* a failed backup must never block saving the workout */ }
  }

  function exportJSON(){
    download("strength-log-backup-"+todayISO()+".json", JSON.stringify(state.data,null,2), "application/json");
    state.data.meta = state.data.meta || {};
    state.data.meta.lastBackup = todayISO();
    commit("Backed up — keep that file off this phone");
  }

  /* How exposed is the log right now? */
  function backupAge(){
    if(!state.data.sessions.length) return null;          // nothing to lose yet
    var last = state.data.meta && state.data.meta.lastBackup;
    if(!last) return { never:true, days: daysAgo(state.data.sessions
      .map(function(s){ return s.date; }).sort()[0]) };
    return { never:false, days: daysAgo(last) };
  }


  /* ============ cloud sync ============
     Local-first. The browser store stays the working copy so the app is instant
     and works with no signal; the server is the durable copy. Every sync pushes
     local up first, then pulls the merged result back down — so a push that
     failed last week is not lost, and the pull can never erase something the
     server hasn't seen yet. */

  var sb = null;
  var cloud = { on:false, user:null, busy:false, error:null, pending:false };

  function cloudConfigured(){
    var c = window.SL_CONFIG || {};
    return !!(c.supabaseUrl && c.supabaseAnonKey && c.supabaseUrl.indexOf("http") === 0);
  }

  function cloudInit(){
    if(sb || !cloudConfigured() || !window.supabase || !window.supabase.createClient) return;
    var c = window.SL_CONFIG;
    try {
      sb = window.supabase.createClient(c.supabaseUrl, c.supabaseAnonKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
      });
    } catch(err){ cloud.error = "Could not start the client"; return; }

    cloud.on = true;

    sb.auth.getSession().then(function(res){
      cloud.user = (res && res.data && res.data.session) ? res.data.session.user : null;
      render();
      if(cloud.user) syncNow(true);
    }).catch(function(){});

    sb.auth.onAuthStateChange(function(_evt, session){
      var was = cloud.user;
      cloud.user = session ? session.user : null;
      render();
      if(cloud.user && !was) syncNow(true);
    });
  }

  function slugOf(e){ return e.slug || slugify(e.name); }

  function pushAll(){
    var uid = cloud.user.id;

    var exRows = state.data.exercises.map(function(e){
      return {
        user_id: uid, slug: slugOf(e), name: e.name, gear: e.gear || "",
        muscle: e.muscle, eq: e.eq || "Machine",
        target_reps: e.target, weight_step: e.step,
        per_side: !!e.perSide, assist: !!e.assist
      };
    });

    return sb.from("exercises").upsert(exRows, { onConflict: "user_id,slug" })
      .then(function(r){ if(r.error) throw r.error; return sb.from("exercises").select("id,slug"); })
      .then(function(r){
        if(r.error) throw r.error;
        var bySlug = {};
        r.data.forEach(function(row){ bySlug[row.slug] = row.id; });

        var dayRows = Object.keys(state.data.days || {}).map(function(d){
          return { user_id: uid, day: d, split: state.data.days[d] };
        });
        var p = dayRows.length
          ? sb.from("workout_days").upsert(dayRows, { onConflict: "user_id,day" })
          : Promise.resolve({});
        return p.then(function(){ return bySlug; });
      })
      .then(function(bySlug){
        var sessRows = [];
        state.data.sessions.forEach(function(s){
          var e = ex(s.exerciseId);
          if(!e || !s.sets.length) return;
          var exId = bySlug[slugOf(e)];
          if(!exId) return;
          sessRows.push({ user_id: uid, day: s.date, exercise_id: exId });
        });
        if(!sessRows.length) return;

        return sb.from("sessions")
          .upsert(sessRows, { onConflict: "user_id,day,exercise_id" })
          .select("id,day,exercise_id")
          .then(function(r){
            if(r.error) throw r.error;
            var idFor = {}, ids = [];
            r.data.forEach(function(row){
              idFor[row.day + "|" + row.exercise_id] = row.id;
              ids.push(row.id);
            });
            /* Replace the sets rather than merging them: a session you edited
               locally should end up with exactly the sets you can see. */
            return sb.from("sets").delete().in("session_id", ids).then(function(){
              var setRows = [];
              state.data.sessions.forEach(function(s){
                var e = ex(s.exerciseId);
                if(!e) return;
                var sessId = idFor[s.date + "|" + bySlug[slugOf(e)]];
                if(!sessId) return;
                s.sets.forEach(function(st, i){
                  setRows.push({ session_id: sessId, set_no: i+1, weight: st.w, reps: st.r });
                });
              });
              if(!setRows.length) return;
              return sb.from("sets").insert(setRows).then(function(r2){
                if(r2.error) throw r2.error;
              });
            });
          });
      });
  }

  function pullAll(){
    return Promise.all([
      sb.from("exercises").select("*"),
      sb.from("sessions").select("id,day,exercise_id"),
      sb.from("sets").select("session_id,set_no,weight,reps"),
      sb.from("workout_days").select("day,split")
    ]).then(function(res){
      res.forEach(function(r){ if(r.error) throw r.error; });
      var exs = res[0].data, sess = res[1].data, sets = res[2].data, days = res[3].data;

      var localBySlug = {};
      state.data.exercises.forEach(function(e){ localBySlug[slugOf(e)] = e; });

      var byServerId = {};
      exs.forEach(function(row){
        var local = localBySlug[row.slug];
        if(!local){
          local = { id: "srv_" + row.id.slice(0,8), slug: row.slug };
          state.data.exercises.push(local);
        }
        local.name    = row.name;
        local.gear    = row.gear;
        local.muscle  = row.muscle;
        local.eq      = row.eq;
        local.target  = row.target_reps;
        local.step    = Number(row.weight_step);
        local.perSide = row.per_side;
        local.assist  = row.assist;
        byServerId[row.id] = local;
      });

      var bySession = {};
      sets.forEach(function(st){
        (bySession[st.session_id] = bySession[st.session_id] || []).push(st);
      });

      var rebuilt = [];
      sess.forEach(function(row){
        var e = byServerId[row.exercise_id];
        var list = bySession[row.id];
        if(!e || !list || !list.length) return;
        list.sort(function(a,b){ return a.set_no - b.set_no; });
        rebuilt.push({
          id: "srv_" + row.id.slice(0,8),
          date: row.day,
          exerciseId: e.id,
          sets: list.map(function(x){ return { w: Number(x.weight), r: x.reps }; })
        });
      });
      state.data.sessions = rebuilt;

      var dmap = {};
      days.forEach(function(d){ dmap[d.day] = d.split; });
      state.data.days = dmap;
    });
  }

  function syncNow(quiet){
    if(!sb || !cloud.user) return Promise.resolve();
    if(cloud.busy){ cloud.pending = true; return Promise.resolve(); }

    cloud.busy = true;
    cloud.error = null;
    render();

    return pushAll()
      .then(pullAll)
      .then(function(){
        cloud.busy = false;
        state.data.meta = state.data.meta || {};
        state.data.meta.lastSync = new Date().toISOString();
        save();
        render();
        if(!quiet) toast("Synced");
        if(cloud.pending){ cloud.pending = false; syncNow(true); }
      })
      .catch(function(err){
        cloud.busy = false;
        cloud.pending = false;
        /* Nothing local is discarded on failure — the next sync retries it. */
        cloud.error = (err && (err.message || err.error_description)) || "Sync failed";
        render();
        if(!quiet) toast("Sync failed");
      });
  }

  function syncAgo(){
    var t = state.data.meta && state.data.meta.lastSync;
    if(!t) return "never";
    var mins = Math.floor((Date.now() - new Date(t).getTime()) / 60000);
    if(mins < 1)    return "just now";
    if(mins < 60)   return mins + " min ago";
    if(mins < 1440) return Math.floor(mins/60) + "h ago";
    return Math.floor(mins/1440) + "d ago";
  }

  function cloudPanel(){
    if(!cloudConfigured()){
      return '<div class="sl-hint" style="margin-top:12px">Cloud sync is off. Add your Supabase URL and anon key to <b style="color:var(--chalk)">config.js</b> to turn it on.</div>';
    }
    var h = '<div class="sl-card">';
    if(!cloud.user){
      h += '<div style="font-size:14px;font-weight:600;margin-bottom:4px">Sync across devices</div>';
      h += '<div style="font-size:12px;line-height:1.5;color:var(--steel-dim);margin-bottom:12px">Sign in and your log lives on the server as well as this phone. We email you a link — no password.</div>';
      h += '<input class="sl-search" id="sl-email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" style="margin-top:0">';
      h += '<div style="margin-top:10px"><button class="sl-btn" data-act="signin">Email me a link</button></div>';
    } else {
      h += '<div style="font-size:14px;font-weight:600;margin-bottom:4px">Signed in</div>';
      h += '<div class="sl-status" style="margin-top:2px">'+esc(cloud.user.email || "")+'<br>Last sync: <b>'+syncAgo()+'</b></div>';
      h += '<div style="margin-top:12px"><button class="sl-btn" data-act="syncnow"'+(cloud.busy?' disabled':'')+'>'+
           (cloud.busy ? 'Syncing…' : 'Sync now')+'</button></div>';
      h += '<div style="margin-top:10px"><button class="sl-btn-quiet" data-act="signout">Sign out</button></div>';
    }
    if(cloud.error){
      h += '<div class="sl-status" style="color:var(--rust);margin-top:12px">'+esc(cloud.error)+'</div>';
    }
    h += '</div>';
    return h;
  }

  /* ============ boot ============ */
  /* Ask the browser not to evict this origin when the device runs low on space.
     This does nothing against a manual "clear site data" — only backups cover that. */
  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persisted()
      .then(function(already){ return already ? true : navigator.storage.persist(); })
      .then(function(ok){ state.persisted = !!ok; if(state.tab==="library") render(); })
      .catch(function(){ state.persisted = false; });
  } else {
    state.persisted = false;
  }

  var LIB_VERSION = 2;

  /* Fold the new catalogue into an existing install without disturbing anything
     already logged. Matching is by name, so an exercise you have history on keeps
     its id and its sessions; only genuinely new entries get appended. */
  function migrateLibrary(data){
    if(data.meta && data.meta.libVersion >= LIB_VERSION) return data;

    var have = {};
    data.exercises.forEach(function(e){ have[e.name.toLowerCase()] = e; });

    var used = {};
    data.sessions.forEach(function(s){ used[s.exerciseId] = 1; });

    var added = 0;
    seed().forEach(function(fresh){
      var match = have[fresh.name.toLowerCase()];
      if(match){
        /* carry over the fields the old library never had */
        if(match.eq === undefined) match.eq = fresh.eq;
        if(match.perSide === undefined) match.perSide = fresh.perSide;
        if(match.assist === undefined) match.assist = fresh.assist;
        if(!match.gear || match.gear === "Free weight") match.gear = fresh.gear;
        return;
      }
      fresh.id = "n" + LIB_VERSION + "_" + added;
      data.exercises.push(fresh);
      added++;
    });

    /* Old barbell entries aren't available at Planet Fitness. Drop the untouched
       ones; keep any you actually logged, because that history is real. */
    data.exercises = data.exercises.filter(function(e){
      var stale = /^(Barbell (squat|bench press|row)|Romanian deadlift|Hip thrust|Pull-up|Tricep dip|Calf raise|Ab crunch|Machine row|Cable curl|Preacher curl|Shoulder press|Chest press|Cable fly|Lateral raise|Rear delt fly|Seated leg curl|Leg extension|Leg press|Hack squat|Face pull|Cable crunch|Cable lateral raise|Overhead tricep extension|Straight-arm pulldown|Seated cable row|Lat pulldown|Hanging leg raise|Dumbbell .*|Incline chest press|Pec deck fly|Tricep pushdown|Hammer curl|Push-up|Plank)$/.test(e.name);
      var isOldId = /^x\d+$/.test(e.id) && e.eq === undefined;
      return used[e.id] || !(stale && isOldId);
    });

    data.meta = data.meta || {};
    data.meta.libVersion = LIB_VERSION;

    var taken = {};
    data.exercises.forEach(function(e){
      if(!e.slug) e.slug = slugify(e.name);
      while(taken[e.slug]) e.slug += "-x";
      taken[e.slug] = 1;
    });
    return data;
  }

  load().then(function(saved){
    if(saved && saved.exercises && saved.exercises.length){
      state.data = saved;
      if(!state.data.sessions) state.data.sessions = [];
      if(!state.data.meta) state.data.meta = { lastBackup: null };
      if(!state.data.days) state.data.days = {};
      state.data = migrateLibrary(state.data);
      save();
    } else {
      state.data = { exercises: seed(), sessions: [], days: {}, meta: { lastBackup: null, libVersion: LIB_VERSION } };
      save();
    }
    document.getElementById("sl-boot").classList.add("sl-hide");
    document.getElementById("sl-shell").classList.remove("sl-hide");
    render();

    /* The client library is a deferred CDN script and may not have arrived yet —
       and offline it never will. Poll briefly, then give up quietly and carry on
       as a purely local app. */
    if(cloudConfigured()){
      var tries = 0;
      var waiting = setInterval(function(){
        tries++;
        if(window.supabase && window.supabase.createClient){
          clearInterval(waiting);
          cloudInit();
        } else if(tries > 40){
          clearInterval(waiting);
        }
      }, 250);
    }
  });
})();
</script>

<script>
/* Register the offline worker so the log opens in a basement gym with no signal. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () { /* offline support is optional */ });
  });
}
</script>
</body>
